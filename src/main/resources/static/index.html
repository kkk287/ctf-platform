<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目 · CTF PLATFORM</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner" id="topbar"></div>
</header>

<main class="page">
  <section class="panel hero" id="hero">
    <div>
      <div id="hero-badges" class="hero-meta" style="margin-top:0"></div>
      <h1 id="hero-title">加载中…</h1>
      <p id="hero-desc" class="muted">正在读取赛事信息。</p>
      <div class="hero-meta" id="hero-meta"></div>
    </div>
    <div class="hero-side" id="hero-stats">
      <div class="stat-line"><span>题目数量</span><strong>—</strong></div>
      <div class="stat-line"><span>我的进度</span><strong>—</strong></div>
      <div class="stat-line"><span>我的积分</span><strong>—</strong></div>
      <div class="stat-line"><span>截止时间</span><strong>—</strong></div>
    </div>
  </section>

  <div id="announcement-slot"></div>

  <section class="panel panel-pad">
    <div class="toolbar" style="margin-top:0">
      <div class="event-tabs" id="event-tabs"></div>
      <div class="spacer"></div>
      <div class="tabs" id="category-tabs">
        <button type="button" class="active" data-cat="">全部</button>
        <button type="button" data-cat="WEB">Web</button>
        <button type="button" data-cat="PWN">Pwn</button>
        <button type="button" data-cat="CRYPTO">Crypto</button>
        <button type="button" data-cat="MISC">Misc</button>
        <button type="button" data-cat="REVERSE">Reverse</button>
      </div>
    </div>
    <div class="toolbar">
      <input class="input" id="search-input" style="max-width:280px" placeholder="搜索题目名称或描述…">
      <label class="checkbox"><input type="checkbox" id="solved-filter"> 只看未解出</label>
      <div class="spacer"></div>
      <button class="btn btn-sm btn-ghost" id="refresh-btn" type="button">刷新</button>
    </div>
    <div id="challenge-grid" class="challenge-grid">
      <div class="loading">加载题目</div>
    </div>
  </section>
</main>

<div class="page-footer">
  <span>CTF PLATFORM · Spring Boot 3 · JWT · H2</span>
  <span>flag 仅在服务端哈希比对，不落明文</span>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/challenges.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的战绩 · CTF PLATFORM</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner" id="topbar"></div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title"><span class="hash">&gt;</span>我的战绩</h1>
      <p class="page-sub" id="page-sub">个人解题记录、赛事/练习积分与战队管理。</p>
    </div>
    <button class="btn btn-sm" id="refresh-btn" type="button">刷新</button>
  </div>

  <div class="stat-cards">
    <div class="stat-card">
      <div class="label">累计得分</div>
      <div class="value cyan" id="stat-points">—</div>
      <div class="sub">跨赛事/练习累计</div>
    </div>
    <div class="stat-card">
      <div class="label">解题数量</div>
      <div class="value green" id="stat-solves">—</div>
      <div class="sub">唯一题目计一次</div>
    </div>
    <div class="stat-card">
      <div class="label">提示消耗</div>
      <div class="value amber" id="stat-hint">—</div>
      <div class="sub">已解锁提示扣分合计</div>
    </div>
    <div class="stat-card">
      <div class="label">所属战队</div>
      <div class="value" id="stat-team" style="font-size:19px">—</div>
      <div class="sub" id="stat-role">—</div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:1.6fr 1fr;align-items:start">
    <section class="panel panel-pad">
      <p class="section-title">解题记录</p>
      <div class="table-wrap">
        <table class="data">
          <thead>
          <tr><th>题目</th><th>赛事/练习</th><th>类型</th><th>得分构成</th><th>血奖</th><th>解出时间</th></tr>
          </thead>
          <tbody id="solve-body">
          <tr><td colspan="6" class="loading">加载战绩</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <aside class="grid">
      <section class="panel panel-pad">
        <p class="section-title">账号</p>
        <div id="account-box">
          <div class="muted small">加载中…</div>
        </div>
      </section>

      <section class="panel panel-pad">
        <p class="section-title">战队</p>
        <div id="team-box">
          <div class="muted small">加载中…</div>
        </div>
      </section>

      <section class="panel panel-pad">
        <p class="section-title">赛事战绩</p>
        <div id="event-stats">
          <div class="muted small">加载中…</div>
        </div>
      </section>
    </aside>
  </div>
</main>

<div class="page-footer">
  <span>CTF PLATFORM · PROFILE</span>
  <span>战队榜规则：成员得分求和，同题只计最高</span>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/profile.js"></script>
</body>
</html>

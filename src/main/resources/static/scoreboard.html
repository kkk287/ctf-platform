<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜 · CTF PLATFORM</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner" id="topbar"></div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title"><span class="hash">&gt;</span>排行榜</h1>
      <p class="page-sub" id="page-sub">同一赛事内个人榜与战队榜独立统计，练习区不与赛事串分。</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="select" id="limit-select" style="width:auto">
        <option value="20">Top 20</option>
        <option value="50">Top 50</option>
        <option value="100">Top 100</option>
      </select>
      <button class="btn btn-sm" id="refresh-btn" type="button">刷新</button>
    </div>
  </div>

  <div class="toolbar" style="margin-top:0">
    <div class="event-tabs" id="event-tabs"></div>
    <div class="spacer"></div>
    <div class="tabs" id="board-tabs">
      <button type="button" class="active" data-type="USER">个人榜</button>
      <button type="button" data-type="TEAM">战队榜</button>
    </div>
  </div>

  <div id="my-rank"></div>

  <div class="podium" id="podium"></div>

  <div class="grid" style="grid-template-columns:1.55fr 1fr">
    <section class="panel panel-pad">
      <p class="section-title" id="table-title">个人排行</p>
      <div class="table-wrap">
        <table class="data">
          <thead id="board-head"></thead>
          <tbody id="board-body">
            <tr><td class="loading">加载排行榜</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel panel-pad">
      <p class="section-title">最近解题动态</p>
      <div class="timeline" id="recent-timeline">
        <div class="muted small">加载中…</div>
      </div>
    </section>
  </div>
</main>

<div class="page-footer">
  <span>CTF PLATFORM · SCOREBOARD</span>
  <span>同分按最后得分时间升序</span>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/scoreboard.js"></script>
</body>
</html>

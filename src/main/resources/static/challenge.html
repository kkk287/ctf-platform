<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目详情 · CTF PLATFORM</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner" id="topbar"></div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <a id="back-link" href="/index.html" class="small">← 返回题目列表</a>
      <h1 class="page-title" id="detail-title"><span class="hash">#</span>加载中…</h1>
      <p class="page-sub" id="detail-sub">正在读取题目信息。</p>
    </div>
  </div>

  <div class="challenge-detail">
    <section class="panel">
      <div class="detail-head">
        <div id="detail-badges"></div>
        <div class="detail-title" id="detail-name">—</div>
        <div class="muted small" id="detail-meta">—</div>
      </div>
      <div class="detail-body">
        <p class="section-title">题目描述</p>
        <p class="description" id="detail-description">—</p>

        <div id="attachment-section" style="margin-top:20px; display:none">
          <p class="section-title">附件</p>
          <div class="attachment">
            <div class="file">
              <div class="file-icon">ZIP</div>
              <div>
                <div class="file-name mono" id="attachment-name">—</div>
                <div class="muted small" id="attachment-size"></div>
              </div>
            </div>
            <button class="btn btn-sm" id="download-btn" type="button">下载</button>
          </div>
        </div>

        <div style="margin-top:22px">
          <p class="section-title">提示</p>
          <div class="hint-list" id="hint-list">
            <div class="muted small">加载中…</div>
          </div>
        </div>
      </div>
    </section>

    <aside class="grid">
      <section class="panel panel-pad">
        <p class="section-title">提交 flag</p>
        <div class="submit-box">
          <div id="submit-area">
            <form id="submit-form">
              <input class="input flag-input" id="flag-input" maxlength="200"
                     placeholder="flag{...}" autocomplete="off" spellcheck="false">
              <button class="btn btn-primary btn-block" id="submit-btn" type="submit"
                      style="margin-top:10px">提交</button>
            </form>
            <div class="muted small" style="margin-top:8px">
              错误提交有冷却与次数限制；正确提交后不可重复提交。
            </div>
          </div>
          <div id="submit-result"></div>
        </div>
      </section>

      <section class="panel panel-pad">
        <p class="section-title">最近解题动态</p>
        <div class="timeline" id="solve-timeline">
          <div class="muted small">加载中…</div>
        </div>
      </section>
    </aside>
  </div>
</main>

<div class="page-footer">
  <span>CTF PLATFORM · 题目详情</span>
  <span id="footer-event">—</span>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/challenge.js"></script>
</body>
</html>

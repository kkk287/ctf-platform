server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: ctf-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mongodb:
      uri: ${MONGO_URI:mongodb://127.0.0.1:27017/ctf}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Redis / Mongo 健康检查随对应开关联动，默认关闭
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
    mongo:
      enabled: ${MONGO_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 提供至少 32 字节的随机字符串
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    max-attachment-size: ${MAX_ATTACHMENT_SIZE:20971520}
  submission:
    max-wrong-attempts: ${MAX_WRONG_ATTEMPTS:5}
    window-minutes: ${WRONG_WINDOW_MINUTES:5}
    cooldown-seconds: ${SUBMIT_COOLDOWN_SECONDS:5}
  demo:
    # 首次启动且数据库为空时写入演示赛事/题目/解题记录
    enabled: ${DEMO_SEED_ENABLED:true}
  redis:
    # 开启后 JWT 吊销黑名单改用 Redis（多实例共享）；默认内存实现
    enabled: ${REDIS_ENABLED:false}
  mongo:
    # 开启后审计日志同步镜像到 MongoDB 的 op_logs 集合
    enabled: ${MONGO_ENABLED:false}

logging:
  level:
    root: INFO
    com.example.ctf: INFO

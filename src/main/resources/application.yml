server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: ctf-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 提供至少 32 字节的随机字符串
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    max-attachment-size: ${MAX_ATTACHMENT_SIZE:20971520}
  submission:
    max-wrong-attempts: ${MAX_WRONG_ATTEMPTS:5}
    window-minutes: ${WRONG_WINDOW_MINUTES:5}
    cooldown-seconds: ${SUBMIT_COOLDOWN_SECONDS:5}
  demo:
    # 首次启动且数据库为空时写入演示赛事/题目/解题记录
    enabled: ${DEMO_SEED_ENABLED:true}

logging:
  level:
    root: INFO
    com.example.ctf: INFO

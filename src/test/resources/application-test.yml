spring:
  datasource:
    url: jdbc:h2:mem:ctftest;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  storage:
    upload-dir: ${java.io.tmpdir}/ctf-platform-test-uploads
  submission:
    max-wrong-attempts: 3
    window-minutes: 10
    cooldown-seconds: 0
  demo:
    enabled: true

# 服务器端编排文件：仅拉取镜像，不依赖源码构建
# 由 GitHub Actions 自动复制到服务器 /opt/ctf/docker-compose.yml
# 编排 MySQL + Redis + MongoDB；数据库密码务必在 .env 中覆盖默认值
services:
  mysql:
    image: mysql:8.0
    container_name: ctf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 MYSQL_ROOT_PASSWORD，请在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ctf}
      MYSQL_USER: ${MYSQL_USER:-ctf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?缺少 MYSQL_PASSWORD，请在 .env 中设置}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ctf-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:6
    container_name: ctf-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ctf:
    image: ${APP_IMAGE:?缺少 APP_IMAGE，请在 .env 中设置，例如 ghcr.io/kkk287/ctf-platform:latest}
    container_name: ctf-platform
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ctf}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-ctf}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?缺少 JWT_SECRET，请在 .env 中设置至少 32 字节随机字符串}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_ENABLED: ${MONGO_ENABLED:-true}
      MONGO_URI: mongodb://mongo:27017/${MYSQL_DATABASE:-ctf}
      UPLOAD_DIR: /app/data/uploads
      TZ: Asia/Shanghai
    volumes:
      - ctf-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  ctf-data:
    name: ctf-platform-data
  mysql-data:
    name: ctf-platform-mysql
  mongo-data:
    name: ctf-platform-mongo

# 服务器端编排文件：仅拉取镜像，不依赖源码构建
# 由 GitHub Actions 自动复制到服务器 /opt/ctf/docker-compose.yml
services:
  ctf:
    image: ${APP_IMAGE:?缺少 APP_IMAGE，请在 .env 中设置，例如 ghcr.io/kkk287/ctf-platform:latest}
    container_name: ctf-platform
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-h2}
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      UPLOAD_DIR: /app/data/uploads
      TZ: Asia/Shanghai
    volumes:
      - ctf-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  ctf-data:
    name: ctf-platform-data

# 开箱即用：单服务 H2 编排
#   docker compose up -d --build
# 数据落在命名卷 ctf-platform-data（H2 文件库 /app/data/ctf.mv.db + 附件），重启不丢。
# 如需 MySQL + Redis + MongoDB 全家桶：docker compose -f docker-compose.full.yml up -d --build
services:
  ctf:
    build:
      context: .
    image: ${APP_IMAGE:-ctf-platform:local}
    container_name: ctf-platform
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: h2
      # 用 `${DB_URL-默认值}`：未设置时回落到卷内 H2 文件库；设置时按用户值覆盖。
      # 不要写成空字符串（Spring 的 ${DB_URL:...} 不会把空值当默认值处理）。
      DB_URL: "${DB_URL-jdbc:h2:file:/app/data/ctf;DB_CLOSE_ON_EXIT=FALSE}"
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      UPLOAD_DIR: /app/data/uploads
      TZ: Asia/Shanghai
      REDIS_ENABLED: "false"
      MONGO_ENABLED: "false"
      # P2/P4 靶场：默认 NoopOrchestrator（无 Docker 降级），AWD check 走模拟探活
      RANGE_ENABLED: ${RANGE_ENABLED:-false}
      RANGE_DOCKER_HOST: ${RANGE_DOCKER_HOST:-unix:///var/run/docker.sock}
      AWD_SIMULATE_NOOP: ${AWD_SIMULATE_NOOP:-true}
    volumes:
      - ctf-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  ctf-data:
    name: ctf-platform-data

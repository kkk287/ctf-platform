name: Deploy

# 触发方式：
#   1) 打 tag（推荐）：git tag v1.0.0 && git push origin v1.0.0
#   2) 手动：Actions -> Deploy -> Run workflow
# 说明：镜像始终推送到 ghcr.io；SSH 部署仅在仓库变量 DEPLOY_ENABLED == 'true' 时执行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: build-and-push
    # 只有仓库 Variables 中设置了 DEPLOY_ENABLED=true 才会执行；未配置服务器时自动跳过
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deploy/docker-compose.server.yml
          target: /opt/ctf
          strip_components: 1

      - name: Pull image & restart container
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,APP_PORT
          script: |
            set -e
            cd /opt/ctf
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            # 只更新镜像与端口，保留服务器上已有的 JWT_SECRET 等配置
            touch .env
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi
            if grep -q '^APP_PORT=' .env; then
              sed -i "s|^APP_PORT=.*|APP_PORT=$APP_PORT|" .env
            else
              echo "APP_PORT=$APP_PORT" >> .env
            fi
            docker compose -f docker-compose.server.yml pull
            docker compose -f docker-compose.server.yml up -d
            docker image prune -f
            echo "---- container status ----"
            docker compose -f docker-compose.server.yml ps
